services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: agenthive-falkordb
    ports:
      - "6379:6379"
      - "3001:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    command: >
      redis-server
      --loadmodule /var/lib/falkordb/bin/falkordb.so
      --dir /var/lib/falkordb/data
      --appendonly yes
      --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agenthive-api
    ports:
      - "8000:8000"
    environment:
      - AGENTHIVE_ENV=${AGENTHIVE_ENV:-demo}
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - EXTRACTION_PROVIDER=${EXTRACTION_PROVIDER:-deterministic}
      - EXTRACTION_WORKER_ENABLED=true
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: agenthive-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb_data:
    name: agenthive_falkordb_data